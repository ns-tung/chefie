<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <link href="https://fonts.googleapis.com/css?family=Nunito+Sans:400,600,700" rel="stylesheet" />
  <link rel="shortcut icon" href="assets/images/favicon.png" type="image/x-icon" />
  <link rel="stylesheet" href="assets/sass/main.scss" />
  <script type="module" src="src/controller.js"></script>
  <title>Chefie // Search over a million recipes.</title>
</head>

<body>
  <div class="container">
    <header class="header">
      <a href="/"><img src="assets/images/logo.png" alt="Logo" class="header__logo" /></a>
      <form class="search">
        <input type="text" class="search__field" placeholder="Search over 1,000,000 recipes..." />
        <button class="btn search__btn">
          <svg class="search__icon">
            <use href="assets/images/icons.svg#icon-search"></use>
          </svg>
          <span>Search</span>
        </button>
      </form>

      <nav class="nav">
        <ul class="nav__list">
          <li class="nav__item">
            <button class="nav__btn add-recipe">
              <svg class="nav__icon">
                <use href="assets/images/icons.svg#icon-edit"></use>
              </svg>
              <span>Add recipe</span>
            </button>
          </li>
          <li class="nav__item">
            <button class="nav__btn btn-bookmarks">
              <svg class="nav__icon">
                <use href="assets/images/icons.svg#icon-bookmark"></use>
              </svg>
              <span>Bookmarks</span>
            </button>
            <div class="bookmarks">
              <ul class="bookmarks__list">
                <div class="message">
                  <svg>
                    <use href="assets/images/icons.svg#icon-smile"></use>
                  </svg>
                  <p>
                    No bookmarks yet. Find a nice recipe and bookmark it :)
                  </p>
                </div>
              </ul>
            </div>
          </li>
        </ul>
      </nav>
    </header>

    <div class="search-results">
      <ul class="results"></ul>
      <div class="pagination"></div>

      <p class="copyright">
        &copy; Copyright by
        <a class="twitter-link" target="_blank" href="https://twitter.com/jonasschmedtman">Jonas Schmedtmann</a>. Use
        for learning or your portfolio. Don't use to teach. Don't claim
        as your own.
      </p>
    </div>

    <div class="recipe">
      <div class="message">
        <svg>
          <use href="assets/images/icons.svg#icon-smile"></use>
        </svg>
        <p>Start by searching for a recipe or an ingredient. Have fun!</p>
      </div>
    </div>
  </div>

  <div class="overlay hidden"></div>
  <div class="modal hidden">
    <button class="close-modal">&times;</button>
    <form class="upload">
      <div class="upload__column">
        <h3 class="upload__heading">Recipe data</h3>
        <label for="title">Title</label>
        <input id="title" name="title" type="text" placeholder="Tomato and Feta Baked Eggs" required />
        <label for="source_url">URL</label>
        <input id="source_url" name="source_url" type="text"
          placeholder="https://www.goodhousekeeping.com/food-recipes/a60345193/tomato-and-feta-baked-eggs-recipe/"
          required />
        <label for="image">Image URL</label>
        <input id="image" name="image" type="text"
          placeholder="https://hips.hearstapps.com/hmg-prod/images/ghk050124tomatofetabakedeggs-66194dcb8115d.jpg"
          required />
        <label for="publisher">Publisher</label>
        <input id="publisher" name="publisher" type="text" placeholder="Good Housekeeping" required />
        <label for="cooking_time">Prep time</label>
        <input id="cooking_time" name="cooking_time" type="number" placeholder="25" required />
        <label for="servings">Servings</label>
        <input id="servings" name="servings" type="number" placeholder="4" required />
      </div>

      <div class="upload__column">
        <h3 class="upload__heading">Ingredients</h3>
        <label for="ingredient-1">Ingredient 1</label>
        <input id="ingredient-1" type="text" required name="ingredient-1"
          placeholder="Format: 'Quantity,Unit,Description'" />
        <label for="ingredient-2">Ingredient 2</label>
        <input id="ingredient-2" type="text" name="ingredient-2" placeholder="Format: 'Quantity,Unit,Description'" />
        <label for="ingredient-3">Ingredient 3</label>
        <input id="ingredient-3" type="text" name="ingredient-3" placeholder="Format: 'Quantity,Unit,Description'" />
        <label for="ingredient-4">Ingredient 4</label>
        <input id="ingredient-4" type="text" name="ingredient-4" placeholder="Format: 'Quantity,Unit,Description'" />
        <label for="ingredient-5">Ingredient 5</label>
        <input id="ingredient-5" type="text" name="ingredient-5" placeholder="Format: 'Quantity,Unit,Description'" />
        <label for="ingredient-6">Ingredient 6</label>
        <input id="ingredient-6" type="text" name="ingredient-6" placeholder="Format: 'Quantity,Unit,Description'" />
      </div>

      <button class="btn btn-upload">
        <svg>
          <use href="assets/images/icons.svg#icon-upload-cloud"></use>
        </svg>
        <span>Upload</span>
      </button>
    </form>
  </div>
</body>
</html>
